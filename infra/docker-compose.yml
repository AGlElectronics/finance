# Finance module — base Docker Compose stack for Docker Desktop.
#
# Container ports:
#   Every module in this ecosystem binds :8080 inside its container.
#   The HOST port for Finance is 8130 (API) and 3006 (SPA). Mapping lives below.
#
# Migrations: the `migrate` service is a ONE-SHOT. The backend depends on
# it with service_completed_successfully so cmd/server never runs
# migrations itself.
#
# Object storage (MinIO): Finance stores no files yet, so MinIO is
# intentionally NOT wired in. The S3_* environment schema is kept in
# config.Load() for forward compatibility (invoice PDFs are the obvious
# first file feature).
#
# Reserved HOST ports (Finance module):
#   backend   : 8130  (container :8080)
#   frontend  :  3006 (container :80)
#   postgres  :  5438 (container :5432)

name: finance

services:
  postgres:
    image: postgres:16-alpine
    container_name: finance-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance
      POSTGRES_DB: finance
    ports:
      - "5438:5432"
    volumes:
      - finance-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot migrator. Exits zero on success; the backend waits for that.
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile.migrate
    container_name: finance-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_ENV: development
      DATABASE_URL: postgres://finance:finance@postgres:5432/finance?sslmode=disable
    restart: "no"

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    container_name: finance-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      # Browser-facing base URL uses the HOST port so links in logs /
      # dev tooling point at something humans can click.
      APP_BASE_URL: http://localhost:8130
      # Container binds :8080 (ecosystem convention). Compose maps 8130 -> 8080.
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://finance:finance@postgres:5432/finance?sslmode=disable
      # S3 is OPTIONAL in this phase: Finance stores no files yet. If any
      # S3_* var is set, config.Load requires the full quartet (endpoint /
      # bucket / access key / secret). Leaving them unset keeps it minimal.
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "${S3_USE_PATH_STYLE:-true}"
      DEV_DEFAULT_USER: dev-finance-admin
      # Frontend talks to backend via the nginx reverse proxy on the SAME
      # origin, so CORS only matters for `npm run dev` on the host.
      CORS_ALLOWED_ORIGINS: http://localhost:3006
    ports:
      - "8130:8080"

  frontend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.frontend
      args:
        VITE_DEV_USER: ${VITE_DEV_USER:-dev-finance-admin}
        FINANCE_VERSION: ${FINANCE_VERSION:-dev}
    container_name: finance-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3006:80"

volumes:
  finance-postgres-data:
